<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lúmen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">

    <div class="orb">
      <div class="eyes">
        <span></span>
        <span></span>
      </div>
    </div>

    <h1>LÚMEN</h1>

    <p class="status">Olá. Estou despertando...</p>

    <div class="message">
      Meu nome é Lúmen. Este é o começo da nossa jornada.
    </div>

    <button onclick="greet()">
      Conversar comigo
    </button>

    <div class="input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Escreva uma mensagem"
      >

      <button onclick="sendMessage()">Enviar</button>
    </div>

    <footer>Projeto Lúmen · Versão 0.1</footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
